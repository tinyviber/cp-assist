<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CP Assist</title>
    <link rel="stylesheet" href="./src/theme/tokens.css" />
    <link rel="stylesheet" href="./src/theme/base.css" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside class="rail">
        <div class="rail-top">
          <div class="brand"><span class="mark">C</span><span class="brand-name">CP Assist</span></div>
        </div>
        <nav>
          <div class="nav-gl">训练</div>
          <button data-route="train">
            <svg viewBox="0 0 14 14" width="13" height="13"><path d="M2.5 12V2.5m0 1h8l-2 3 2 3h-8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>今日训练</span>
          </button>
          <button data-route="review">
            <svg viewBox="0 0 14 14" width="13" height="13"><path d="M11.5 7a4.5 4.5 0 1 1-1.3-3.2M11.5 2.5v2.6H8.9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>复盘</span>
          </button>
          <div class="nav-gl">题库</div>
          <button data-route="problems">
            <svg viewBox="0 0 14 14" width="13" height="13"><path d="M7 1.8l5 2.4-5 2.4-5-2.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M2 7.4l5 2.4 5-2.4M2 10.4l5 2.4 5-2.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
            <span>Hard Problems</span><em>31.9K</em>
          </button>
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="crumb"><span>CP Assist</span><i>/</i><b id="crumb-page">今日训练</b></div>
          <div class="tb-right">
            <div class="search" id="search">
              <svg viewBox="0 0 14 14" width="12" height="12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9.2 9.2L12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <input id="search-input" placeholder="搜索题目" autocomplete="off" />
              <kbd>⌘K</kbd>
            </div>
            <button class="icon-btn" id="theme-btn" title="主题">
              <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11zM8 4v8a4 4 0 0 1 0-8z" fill="currentColor"/></svg>
            </button>
          </div>
        </header>
        <main id="page" class="selectable"></main>
      </div>
    </div>

    <div id="overlay"></div>
    <div id="toast" aria-live="polite"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
